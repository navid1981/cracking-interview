<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assessment Event Simulator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }
    h2 { margin-top: 0; color: #f8fafc; }
    .status-card {
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      transition: background 0.2s, border-color 0.2s;
    }
    .active {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }
    .violation {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .counter-box {
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .counter-box span {
      font-size: 22px;
      font-weight: 700;
      display: block;
      margin-top: 4px;
    }
    #log {
      height: 350px;
      overflow-y: auto;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-row { border-bottom: 1px solid #1e293b; padding: 3px 0; }
    .log-err { color: #f87171; font-weight: 600; }
    .log-ok { color: #34d399; }
    .log-key { color: #fbbf24; }
    .log-time { color: #64748b; margin-right: 8px; }
  </style>
</head>
<body>
  <h2>🧪 Assessment Event Simulator & Diagnostics</h2>
  <div id="statusCard" class="status-card active">🟢 WINDOW FOCUSED (ACTIVE)</div>
  <div class="grid">
    <div class="counter-box">
      Blur (Focus Lost) Violations:
      <span id="blurCount" style="color: #34d399;">0</span>
    </div>
    <div class="counter-box">
      Tab Hidden (VisibilityChange) Events:
      <span id="hideCount" style="color: #34d399;">0</span>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <strong>Real-Time Event Stream:</strong>
    <button onclick="clearLogs()" style="background: #334155; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer;">Clear Logs</button>
  </div>
  <div id="log"></div>
  <script>
    const statusCard = document.getElementById('statusCard');
    const blurCountEl = document.getElementById('blurCount');
    const hideCountEl = document.getElementById('hideCount');
    const logEl = document.getElementById('log');
    let blurs = 0;
    let hides = 0;
    function addLog(text, cls) {
      const row = document.createElement('div');
      row.className = `log-row ${cls}`;
      const time = new Date().toLocaleTimeString();
      row.innerHTML = `<span class="log-time">[${time}]</span> ${text}`;
      logEl.prepend(row);
    }
    function clearLogs() {
      logEl.innerHTML = '';
      blurs = 0;
      hides = 0;
      blurCountEl.textContent = '0';
      blurCountEl.style.color = '#34d399';
      hideCountEl.textContent = '0';
      hideCountEl.style.color = '#34d399';
    }
    // 1. Focus Loss / Regain Tracking
    window.addEventListener('blur', () => {
      blurs++;
      blurCountEl.textContent = blurs;
      blurCountEl.style.color = '#f87171';
      statusCard.className = 'status-card violation';
      statusCard.textContent = '🚨 VIOLATION: WINDOW BLURRED (FOCUS STOLEN)';
      addLog('❌ window.blur — Browser window lost active focus!', 'log-err');
    });
    window.addEventListener('focus', () => {
      statusCard.className = 'status-card active';
      statusCard.textContent = '🟢 WINDOW FOCUSED (ACTIVE)';
      addLog('✅ window.focus — Browser window regained focus', 'log-ok');
    });
    // 2. Tab Visibility Tracking
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        hides++;
        hideCountEl.textContent = hides;
        hideCountEl.style.color = '#f87171';
        addLog(`⚠️ visibilitychange: Tab HIDDEN (${document.visibilityState})`, 'log-err');
      } else {
        addLog(`👁️ visibilitychange: Tab VISIBLE (${document.visibilityState})`, 'log-ok');
      }
    });
    // 3. Keyboard Event Interception
    window.addEventListener('keydown', (e) => {
      let parts = [];
      if (e.metaKey) parts.push('Cmd');
      if (e.ctrlKey) parts.push('Ctrl');
      if (e.altKey) parts.push('Alt');
      if (e.shiftKey) parts.push('Shift');
      parts.push(e.key);
      addLog(`⌨️ keydown: ${parts.join('+')} (Code: ${e.code})`, 'log-key');
    });
  </script>
</body>
</html>
