[package]
name = "cracking-interview"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "rustls-tls-native-roots"] }

# Base64 encoding
base64 = "0.22"

# OAuth and HTTP
urlencoding = "2.1"
chrono = "0.4"
rand = "0.8"
tiny_http = "0.12"
dotenv = "0.15"
sha2 = "0.10"

# WebSocket for CDP and Deepgram
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Thread-safe globals
lazy_static = "1.5"

# Image processing
image = "0.25"
hound = "3.5"

# MP3 encoding - LAME encoder (high-level wrapper)
mp3lame-encoder = "0.2"

# Speech recognition - TODO: install libvosk native library and uncomment to enable local transcription
# vosk = "0.2"
# dirs = "5"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
screenshots = "0.7"

# macOS-specific dependencies  
[target.'cfg(target_os = "macos")'.dependencies]
screenshots = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
