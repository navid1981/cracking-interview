<!doctype html>
<!-- A data-interpretation question whose chart is drawn as SVG with real text labels. -->
<html>
<head><meta charset="utf-8"><title>Numerical Reasoning</title></head>
<body>
  <p>Question 3 / 12</p>
  <p>The chart shows company revenue (in $M) by year.</p>
  <svg width="600" height="360" viewBox="0 0 600 360">
    <rect x="60" y="160" width="80" height="160" fill="#4a7"/>
    <rect x="200" y="100" width="80" height="220" fill="#4a7"/>
    <rect x="340" y="60" width="80" height="260" fill="#4a7"/>
    <text x="100" y="345">2019</text><text x="240" y="345">2020</text><text x="380" y="345">2021</text>
    <text x="100" y="150">40</text><text x="240" y="90">55</text><text x="380" y="50">65</text>
  </svg>
  <svg width="16" height="16" class="icon"><path d="M0 0h16v16H0z"/></svg>
  <p>By what percentage did revenue grow from 2019 to 2021?</p>
  <div><label><input type="radio" name="q3"> 25%</label></div>
  <div><label><input type="radio" name="q3"> 62.5%</label></div>
  <div><label><input type="radio" name="q3"> 40%</label></div>
</body>
</html>
